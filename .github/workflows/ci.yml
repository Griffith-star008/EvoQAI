name: AQIP CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Static Analysis & Linting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          pip install flake8 mypy bandit
      - name: Lint with flake8
        run: flake8 src/ --max-line-length=120 --count --statistics
      - name: Type check with mypy
        run: mypy src/ --ignore-missing-imports || true
      - name: Security scan with bandit
        run: bandit -r src/ -ll || true

  test:
    name: Unit & Property-Based Tests
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: pip install pytest pytest-cov
      - name: Run test suite
        run: python tests/test_runtime_evolution.py
      - name: Run pytest (if available)
        run: pytest tests/ -v --tb=short || true

  benchmark:
    name: Performance Regression Benchmark
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run Statistical Validator
        run: python src/research/benchmark/statistical_validator.py
      - name: Run Telemetry Smoke Test
        run: python src/runtime/observability/telemetry.py
      - name: Archive benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: "*.json"

  docker:
    name: Docker Build Validation
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Validate Docker Compose
        run: docker compose config || true
      - name: Build Docker images
        run: docker compose build || true
